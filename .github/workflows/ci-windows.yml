name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  DOTNET_VERSION: '8.0.x'  # 根据您的项目调整 .NET 版本
  CONFIGURATION: 'Release'

jobs:
  build:
    runs-on: windows-latest  # Windows 项目需要 Windows runner
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore CFixer.sln
      
    - name: Build solution
      run: |
        echo "Building ${{ env.CONFIGURATION }} configuration..."
        dotnet build CFixer.sln --configuration ${{ env.CONFIGURATION }} --no-restore /p:Platform="Any CPU"
        
    - name: Run tests (if any)
      run: dotnet test --verbosity normal --configuration ${{ env.CONFIGURATION }}
      
    - name: Publish application
      run: |
        dotnet publish CFixer.sln `
          --configuration ${{ env.CONFIGURATION }} `
          --output ./publish `
          --no-build `
          -p:PublishReadyToRun=true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=none `
          -p:DebugSymbols=false
          
    - name: Create artifacts
      run: |
        # 压缩发布文件
        Compress-Archive -Path ./publish/* -DestinationPath ./CFixer-${{ github.run_number }}.zip -Force
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CFixer-${{ env.CONFIGURATION }}
        path: |
          ./CFixer-${{ github.run_number }}.zip
          ./publish/
        retention-days: 7